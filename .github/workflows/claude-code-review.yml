# Automatic code review of pull requests by Claude (anthropics/claude-code-action, code-review plugin).
# Needs the repository secret ANTHROPIC_API_KEY (Settings → Secrets and variables → Actions) and the Claude GitHub App
# installed on this repository. Comments appear on the PR; they never block merging.
#
# Draft PRs are skipped: the review runs when a PR is marked "Ready for review". Release PRs (develop → main) are
# skipped too, their changes were reviewed on the way into develop.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.head_ref != 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
